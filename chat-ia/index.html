<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câmara Fria - ChatBot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <button class="new-chat-btn" onclick="limparChat()">
                <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="16" width="16"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Nova Conversa
            </button>
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="avatar">CF</div>
                    <span>Operador Logístico</span>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <span class="model-badge">GPT (ChatBot Câmara Fria)</span>
                <div class="status-indicator">
                    <span class="dot"></span> Online
                </div>
            </header>

            <div id="chat-container" class="chat-viewport">
                <div class="welcome-screen" id="welcome-screen">
                    <h1>Olá, posso ajudar?</h1>
                    <div class="suggestion-grid">
                        <div class="suggestion-card" onclick="enviarSugestao('Qual a temperatura ideal?')">
                            <h3>Temperatura Ideal</h3>
                            <p>Consulte as faixa ideal para o suco resfriado.</p>
                        </div>
                        <div class="suggestion-card" onclick="enviarSugestao('códigos laranja integral nacional')">
                            <h3>Laranja Integral Nacional</h3>
                            <p>Consulte os códigos dos produtos.</p>
                        </div>
                    </div>
                </div>
                <div id="messages-list" class="messages-list"></div>
            </div>

            <div class="input-container">
                <div class="input-box">
                    <textarea id="user-input" rows="1" placeholder="Pergunte sobre normas, temperaturas ou EPIs..."></textarea>
                    <button id="send-btn" onclick="processarEnvio()">
                        <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="16" width="16"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                    </button>
                </div>
                <div class="disclaimer">&copy; Moisés J. M. Lima. Todos os direitos reservados.</div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
