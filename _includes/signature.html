<style>
    footer {

        width: 100%;

        text-align: center; /* Centraliza o texto de cima */

        font-size: 0.5rem;
        letter-spacing: 0.5px;
        margin: 0;
    }

    .signature-name {
        font-family: 'Aguafina Script', cursive;
        color: #a0a0a0;
        font-size: 1.3rem;
        margin-left: 0; /* Removida a margem lateral para alinhar certinho embaixo do texto */
        display: inline-block;
        margin-top: 2px;
    }

    /* Estilo para o logotipo centralizado na segunda coluna */
    .footer-logo {
        height: 50px;
        width: auto;
        object-fit: contain;
    }
